<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{id}}</title>
<style>{{{css}}}</style>
</head>
<body>
<main class="card {{tone}} stack" style="width:{{width}}px;height:{{height}}px">
    <div class="row">
      {{#logo}}<img class="mark" src="{{{logo}}}" alt="">{{/logo}}
      {{^logo}}<span class="mark-text">{{business}}</span>{{/logo}}
    </div>
    <h1 class="headline">{{headline}}</h1>
    <div class="stack" style="gap: calc(14px * var(--scale))">
      {{#includes}}<p class="body"><span class="tick">✓</span> {{.}}</p>{{/includes}}
    </div>
    <div class="spacer"></div>
    <div class="row" style="align-items: baseline; gap: calc(20px * var(--scale))">
      <span class="giant" style="font-size: calc(var(--giant) * 0.6)">{{price}}</span>
      {{#was}}<span class="body muted" style="text-decoration: line-through">{{was}}</span>{{/was}}
    </div>
    {{#deadline}}<p class="label">{{deadline}}</p>{{/deadline}}
    {{#cta}}<span class="cta">{{cta}}</span>{{/cta}}
</main>
</body>
</html>
