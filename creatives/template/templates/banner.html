<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{id}}</title>
<style>{{{css}}}</style>
</head>
<body>
<main class="card accent-ground stack" style="width:{{width}}px;height:{{height}}px; justify-content:center; {{#ground}}background:{{ground}};{{/ground}}">
    <span class="label">{{business}}</span>
    <p class="giant" style="font-size: calc(var(--giant) * 0.8)">{{offer}}</p>
    <h1 class="headline" style="font-size: calc(var(--headline) * 0.7)">{{headline}}</h1>
    {{#terms}}<p class="label" style="opacity: 0.85">{{terms}}</p>{{/terms}}
    <div class="spacer"></div>
    {{#cta}}<span class="cta" style="background: var(--ground); color: var(--ink)">{{cta}}</span>{{/cta}}
</main>
</body>
</html>
