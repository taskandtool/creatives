<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{id}}</title>
<style>{{{css}}}</style>
</head>
<body>
<main class="card {{tone}} stack" style="width:{{width}}px;height:{{height}}px">
    <div class="row">
      {{#logo}}<img class="mark" src="{{{logo}}}" alt="">{{/logo}}
      {{^logo}}<span class="mark-text">{{business}}</span>{{/logo}}
    </div>
    <h1 class="headline" style="font-size: calc(var(--headline) * 0.8)">{{headline}}</h1>
    <div class="spacer"></div>
    <div class="stack" style="gap: calc(24px * var(--scale))">
      {{#steps}}
      <div class="row" style="align-items: flex-start; gap: calc(28px * var(--scale))">
        <span class="giant" style="font-size: calc(var(--giant) * 0.35); min-width: 1.4em; color: var(--accent)">{{n}}</span>
        <div><p class="body" style="font-weight: 600; color: inherit">{{title}}</p>{{#text}}<p class="body">{{text}}</p>{{/text}}</div>
      </div>
      {{/steps}}
    </div>
    <div class="spacer"></div>
    {{#cta}}<span class="cta">{{cta}}</span>{{/cta}}
</main>
</body>
</html>
